<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bezier Playground 2</title>
		<style>
			body {
				margin: 0;
				font-family: serif;
				background-color: #111;
				color: #ddd;
				display: flex;
				flex-direction: column;
				align-items: center;
				min-height: 100vh;
			}

			canvas {
				border: 1px solid #555;
				margin-top: 48px;
			}

			canvas.reference-adjust-mode {
				border-color: #f5b64a;
			}

			.panel {
				width: 100%;
				max-width: 960px;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 12px;
				margin-top: 20px;
			}

			.hud {
				text-align: center;
			}

			.controls {
				width: 100%;
				display: flex;
				flex-direction: column;
				gap: 16px;
			}

			.control-section {
				display: flex;
				flex-direction: column;
				gap: 10px;
				padding: 12px 16px;
				border: 1px solid #444;
			}

			.section-title {
				font-weight: bold;
			}

			.toggle-control {
				display: flex;
				gap: 10px;
				align-items: center;
				cursor: pointer;
			}

			.slider-control {
				display: flex;
				flex-direction: column;
				gap: 6px;
			}

			.slider-label-row {
				display: flex;
				justify-content: space-between;
				align-items: center;
			}

			.slider-value {
				font-variant-numeric: tabular-nums;
			}

			.controls input[type="checkbox"],
			.controls input[type="range"] {
				accent-color: #aaa;
			}

			.controls input[type="range"] {
				width: 100%;
			}

			.controls button {
				font: inherit;
				background: #222;
				border: 1px solid #666;
				color: #ddd;
				padding: 4px 10px;
				cursor: pointer;
			}

			.controls button:disabled {
				opacity: 0.4;
				cursor: not-allowed;
			}

			.controls button:not(:disabled):hover {
				background: #333;
			}

			.action-buttons {
				display: flex;
				gap: 12px;
				flex-wrap: wrap;
			}

			.file-input-row {
				display: flex;
				align-items: center;
				gap: 12px;
				flex-wrap: wrap;
			}

			.reference-status {
				color: #999;
			}

			.reference-controls {
				display: flex;
				gap: 12px;
				align-items: center;
				flex-wrap: wrap;
			}
		</style>
	</head>
	<body>
		<canvas id="curve-canvas"></canvas>
		<div class="panel">
			<div class="hud">
				Drag the control points to reshape the curve.
			</div>
			<div class="controls">
				<div class="control-section">
					<div class="section-title">Points</div>
					<div class="action-buttons">
						<button id="duplicate-point" disabled>Duplicate selected point</button>
						<button id="delete-point" disabled>Delete selected point</button>
					</div>
				</div>
				<div class="control-section">
					<div class="section-title">Reference</div>
					<label class="file-input-row">
						<span>Image file</span>
						<input type="file" id="reference-input" accept="image/*" />
					</label>
					<div class="reference-status" id="reference-file-name">No image loaded</div>
					<div class="reference-controls">
						<label class="toggle-control">
							<input type="checkbox" id="reference-toggle" disabled />
							<span>Show reference image</span>
						</label>
						<button id="reference-mode-toggle" disabled>Adjust reference</button>
						<button id="clear-reference" disabled>Clear</button>
					</div>
					<div class="reference-controls">
						<label class="toggle-control">
							<input type="checkbox" id="reference-flip-x" disabled />
							<span>Flip horizontally</span>
						</label>
						<label class="toggle-control">
							<input type="checkbox" id="reference-flip-y" disabled />
							<span>Flip vertically</span>
						</label>
					</div>
					<label class="slider-control">
						<div class="slider-label-row">
							<span>Zoom</span>
							<span id="reference-zoom-value" class="slider-value">1.00</span>
						</div>
						<input
							type="range"
							id="reference-zoom"
							min="0.2"
							max="3"
							step="0.05"
							value="1"
							disabled
						/>
					</label>
					<label class="slider-control">
						<div class="slider-label-row">
							<span>Pan X</span>
							<span id="reference-pan-x-value" class="slider-value">0px</span>
						</div>
						<input
							type="range"
							id="reference-pan-x"
							min="-400"
							max="400"
							step="5"
							value="0"
							disabled
						/>
					</label>
					<label class="slider-control">
						<div class="slider-label-row">
							<span>Pan Y</span>
							<span id="reference-pan-y-value" class="slider-value">0px</span>
						</div>
						<input
							type="range"
							id="reference-pan-y"
							min="-400"
							max="400"
							step="5"
							value="0"
							disabled
						/>
					</label>
					<label class="slider-control">
						<div class="slider-label-row">
							<span>Opacity</span>
							<span id="reference-opacity-value" class="slider-value">0.60</span>
						</div>
						<input
							type="range"
							id="reference-opacity"
							min="0"
							max="1"
							step="0.05"
							value="0.6"
							disabled
						/>
					</label>
				</div>
				<div class="control-section">
					<div class="section-title">Sampling</div>
					<label class="slider-control">
						<div class="slider-label-row">
							<span>Curve samples</span>
							<span id="steps-value" class="slider-value">1000</span>
						</div>
						<input type="range" id="steps-slider" min="50" max="3000" step="50" value="1000" />
					</label>
				</div>
				<div class="control-section">
					<div class="section-title">Curve softness</div>
					<label class="slider-control">
						<div class="slider-label-row">
							<span>Soft radius</span>
							<span id="soft-radius-value" class="slider-value">2.0</span>
						</div>
						<input
							type="range"
							id="soft-radius-slider"
							min="0.5"
							max="6"
							step="0.1"
							value="2"
						/>
					</label>
					<label class="slider-control">
						<div class="slider-label-row">
							<span>Soft intensity</span>
							<span id="soft-intensity-value" class="slider-value">0.40</span>
						</div>
						<input
							type="range"
							id="soft-intensity-slider"
							min="0.05"
							max="1"
							step="0.05"
							value="0.4"
						/>
					</label>
				</div>
				<div class="control-section">
					<div class="section-title">Display</div>
					<label class="toggle-control">
						<input type="checkbox" id="trail-toggle" checked />
						<span>Show scaffolding trails</span>
					</label>
				</div>
			</div>
		</div>
		<script src="main.js"></script>
	</body>
</html>
